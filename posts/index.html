<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Posts | MrKronick</title>
  <meta name="theme-color" content="#0a0a0f">
  
  <!-- ФАВИКОНКИ -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0a0a0f; }
    ::-webkit-scrollbar-thumb { background: #6c63ff; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #b388ff; }
    html { scrollbar-width: thin; scrollbar-color: #6c63ff #0a0a0f; }

    body { font-family: 'Inter', 'Noto Sans SC', sans-serif; background: #0a0a0f; color: #e8e9f0; line-height: 1.6; min-height: 100vh; overflow-x: hidden; position: relative; }
    html[lang="zh"] body { font-family: 'Noto Sans SC', 'Inter', sans-serif; }
    
    #bgCanvas { position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:0; pointer-events:none; opacity:0.4; }

    .container { max-width: 900px; margin: 0 auto; padding: 2rem; position: relative; z-index: 2; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 2rem; border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 3rem; flex-wrap: wrap; gap: 1rem; }
    .logo { font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:2.2rem; background: linear-gradient(135deg, #fff, #b388ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 15px rgba(179,136,255,0.7)); text-decoration: none; transition: transform 0.3s; }
    .logo:hover { transform: scale(1.05); }
    
    .header-right { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .btn { background:rgba(108,99,255,0.2); border:1px solid rgba(108,99,255,0.5); padding:0.6rem 1.5rem; border-radius:3rem; color:white; text-decoration:none; font-weight:600; font-size: 0.9rem; transition: 0.3s; display: inline-flex; align-items: center; gap: 0.5rem; touch-action: manipulation; }
    .btn:hover { background:#6c63ff; border-color:#6c63ff; box-shadow:0 10px 25px #6c63ffaa; transform: translateX(-3px); }

    .lang-switch { display: flex; gap: 0.4rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 3rem; padding: 0.3rem; backdrop-filter: blur(10px); }
    .lang-btn { background: transparent; border: none; color: #cfc8ff; font-family: inherit; font-weight: 600; font-size: 0.9rem; padding: 0.5rem 1rem; border-radius: 3rem; transition: all 0.3s ease; letter-spacing: 0.5px; display: inline-flex; align-items: center; gap: 0.4rem; touch-action: manipulation; cursor: pointer; }
    .lang-btn:hover:not(.active) { background: rgba(108,99,255,0.2); color: #fff; }
    .lang-btn.active { background: #6c63ff; color: #fff; box-shadow: 0 4px 15px #6c63ffaa; }
    .lang-btn .flag { font-size: 1.05rem; line-height: 1; }

    .page-title { font-size: 2.5rem; margin-bottom: 2rem; font-family: 'Space Grotesk', sans-serif; color: #fff; text-align: center; }

    .post-card { background: rgba(18,20,28,0.65); border: 1px solid rgba(255,255,255,0.08); border-radius: 1.5rem; padding: 2.5rem; margin-bottom: 2.5rem; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); transition: all 0.4s ease; position: relative; overflow: hidden; opacity: 0; transform: translateY(30px); animation: fadeInUp 0.6s cubic-bezier(0.25, 0.8, 0.25, 1) forwards; }
    .post-card::before { content:''; position:absolute; inset:0; border-radius:1.5rem; padding:1px; background:linear-gradient(135deg, #b388ff, #6c63ff); -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity:0; transition: opacity 0.4s; }
    .post-card:hover::before { opacity: 1; }
    .post-card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(108,99,255,0.15); }
    
    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

    .post-date { font-size: 0.85rem; color: #b388ff; font-weight: 600; margin-bottom: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
    .post-title { font-family: 'Space Grotesk', sans-serif; font-size: 2rem; color: #fff; margin-bottom: 1.2rem; line-height: 1.3; }
    .post-content { color: #c0c5e0; font-size: 1.1rem; margin-bottom: 2rem; white-space: pre-wrap; }
    
    .post-actions { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 1.5rem; flex-wrap: wrap; gap: 1rem; }
    .like-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #e8e9f0; padding: 0.6rem 1.5rem; border-radius: 3rem; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; font-size: 1rem; transition: 0.3s; font-family: inherit; touch-action: manipulation; }
    .like-btn:hover { background: rgba(108,99,255,0.2); border-color: #6c63ff; }
    .like-btn.liked { color: #ff4444; border-color: #ff4444; background: rgba(255,68,68,0.1); }
    .like-btn.liked i { transform: scale(1.2); }
    .like-btn i { transition: 0.3s; }
    
    .post-link-btn { color: #b388ff; text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; transition: 0.3s; }
    .post-link-btn:hover { color: #fff; gap: 0.8rem; }

    .loader { text-align: center; padding: 3rem; color: #b388ff; font-size: 1.2rem; }
    .no-posts { text-align: center; padding: 3rem; color: #7a7f9a; font-size: 1.1rem; }

    @media (max-width: 768px) {
      .container { padding: 1.5rem; }
      .post-card { padding: 2rem 1.5rem; border-radius: 1.2rem; }
      .post-title { font-size: 1.6rem; }
      header { flex-direction: column; text-align: center; margin-bottom: 2rem; }
      .header-right { justify-content: center; width: 100%; }
      .post-actions { flex-direction: column; align-items: flex-start; gap: 1rem; }
    }
  </style>
</head>
<body>
  <canvas id="bgCanvas"></canvas>
  
  <div class="container">
    <header>
      <a href="../index.html" class="logo">MrKronick</a>
      <div class="header-right">
        <div class="lang-switch" role="group" aria-label="Language">
          <button class="lang-btn" data-lang="ru"><span class="flag">🇷🇺</span> RU</button>
          <button class="lang-btn" data-lang="en"><span class="flag">🇬🇧</span> EN</button>
          <button class="lang-btn" data-lang="zh"><span class="flag">🇨🇳</span> 中文</button>
        </div>
        <a href="../index.html" class="btn"><i class="fas fa-arrow-left"></i> <span data-i18n="back_btn">На главную</span></a>
      </div>
    </header>

    <h1 class="page-title" data-i18n="page_title">Посты</h1>

    <div id="posts-container">
      <div class="loader"><i class="fas fa-spinner fa-spin"></i> <span data-i18n="loading">Загрузка...</span></div>
    </div>
  </div>

  <script>
    const API_URL = 'https://api.mrkronick.site';

    const translations = {
      ru: {
        page_title: "Посты",
        back_btn: "На главную",
        loading: "Загрузка...",
        no_posts: "Постов пока нет.",
        error: "Ошибка сети. Попробуйте позже.",
        link_btn_default: "Перейти по ссылке"
      },
      en: {
        page_title: "Posts",
        back_btn: "Back to Home",
        loading: "Loading...",
        no_posts: "No posts yet.",
        error: "Network error. Please try again later.",
        link_btn_default: "Go to link"
      },
      zh: {
        page_title: "帖子",
        back_btn: "返回首页",
        loading: "加载中...",
        no_posts: "暂时没有帖子。",
        error: "网络错误，请稍后再试。",
        link_btn_default: "前往链接"
      }
    };

    function detectLanguage() {
      const saved = localStorage.getItem('lang');
      if (saved && translations[saved]) return saved;
      const candidates = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
      for (const c of candidates) {
        const code = String(c).toLowerCase();
        if (code.startsWith('ru')) return 'ru';
        if (code.startsWith('zh')) return 'zh';
      }
      return 'en';
    }

    let currentLang = detectLanguage();

    function applyLang(lang) {
      const t = translations[lang];
      if (!t) return;
      currentLang = lang;
      localStorage.setItem('lang', lang);
      document.documentElement.lang = lang;
      
      const titleEl = document.querySelector('title');
      if(titleEl) titleEl.textContent = t.page_title + " | MrKronick";

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key] !== undefined) el.textContent = t[key];
      });

      document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
      
      // Перезагружаем посты, чтобы обновить кнопки "Перейти по ссылке"
      loadPosts();
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => applyLang(btn.dataset.lang));
    });

    async function loadPosts() {
      const t = translations[currentLang];
      const container = document.getElementById('posts-container');
      
      try {
        const res = await fetch(API_URL + '/posts');
        const posts = await res.json();
        const likesRes = await fetch(API_URL + '/likes');
        const globalLikes = await likesRes.json();

        container.innerHTML = '';

        if (posts.length === 0) {
          container.innerHTML = `<div class="no-posts">${t.no_posts}</div>`;
          return;
        }

        posts.forEach((post, index) => {
          const userLiked = localStorage.getItem(`liked_${post.id}`) === 'true';
          const likesCount = globalLikes[post.id] || 0;

          const card = document.createElement('div');
          card.className = 'post-card';
          card.style.animationDelay = `${index * 0.1}s`;
          
          let linkHtml = '';
          if (post.link && post.link.trim() !== '') {
            const btnText = (post.linkText && post.linkText.trim() !== '') ? post.linkText : t.link_btn_default;
            linkHtml = `<a href="${post.link}" target="_blank" class="post-link-btn">${btnText} <i class="fas fa-arrow-right"></i></a>`;
          }

          card.innerHTML = `
            <div class="post-date">${post.date}</div>
            <h2 class="post-title">${post.title}</h2>
            <div class="post-content">${post.content}</div>
            <div class="post-actions">
              <button class="like-btn ${userLiked ? 'liked' : ''}" onclick="toggleLike(this, '${post.id}')">
                <i class="${userLiked ? 'fas' : 'far'} fa-heart"></i>
                <span class="like-count">${likesCount}</span>
              </button>
              ${linkHtml}
            </div>
          `;
          container.appendChild(card);
        });
      } catch (e) {
        container.innerHTML = `<div class="no-posts" style="color: #ff4444;">${t.error}</div>`;
      }
    }

    async function toggleLike(btn, postId) {
      if (btn.classList.contains('liked')) return;
      const icon = btn.querySelector('i');
      const countSpan = btn.querySelector('.like-count');
      btn.classList.add('liked');
      icon.classList.replace('far', 'fas');
      countSpan.textContent = parseInt(countSpan.textContent) + 1;
      localStorage.setItem(`liked_${postId}`, 'true');
      
      try {
        await fetch(API_URL + '/like', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ postId }) });
      } catch (e) {}
    }

    // Инициализация
    applyLang(currentLang);

    // Легкая анимация фона (частицы)
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];
    
    function resizeCanvas() { width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() { this.reset(); }
      reset() { this.x = Math.random() * width; this.y = Math.random() * height; this.radius = Math.random() * 2 + 1; this.speedX = (Math.random() - 0.5) * 0.2; this.speedY = (Math.random() - 0.5) * 0.2; this.opacity = Math.random() * 0.5 + 0.1; }
      update() { this.x += this.speedX; this.y += this.speedY; if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) this.reset(); }
      draw(ctx) { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius*2); gradient.addColorStop(0, `rgba(179,136,255,${this.opacity})`); gradient.addColorStop(1, 'rgba(108,99,255,0)'); ctx.fillStyle = gradient; ctx.fill(); }
    }
    for (let i = 0; i < 50; i++) particles.push(new Particle());
    
    function animate() {
      ctx.clearRect(0, 0, width, height);
      for (let p of particles) { p.update(); p.draw(ctx); }
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
