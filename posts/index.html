<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Posts | MrKronick</title>
  <meta name="theme-color" content="#0a0a0f">
  
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0a0a0f; }
    ::-webkit-scrollbar-thumb { background: #6c63ff; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #b388ff; }
    html { scrollbar-width: thin; scrollbar-color: #6c63ff #0a0a0f; }

    body { font-family: 'Inter', 'Noto Sans SC', sans-serif; background: #0a0a0f; color: #e8e9f0; line-height: 1.6; min-height: 100vh; overflow-x: hidden; position: relative; }
    html[lang="zh"] body { font-family: 'Noto Sans SC', 'Inter', sans-serif; }
    
    #bgCanvas { position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:0; pointer-events:none; opacity:0.4; }

    .container { max-width: 900px; margin: 0 auto; padding: 2rem; position: relative; z-index: 2; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 2rem; border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 3rem; flex-wrap: wrap; gap: 1rem; }
    .logo { font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:2.2rem; background: linear-gradient(135deg, #fff, #b388ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 15px rgba(179,136,255,0.7)); text-decoration: none; transition: transform 0.3s; }
    .logo:hover { transform: scale(1.05); }
    
    .header-right { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .btn { background:rgba(108,99,255,0.2); border:1px solid rgba(108,99,255,0.5); padding:0.6rem 1.5rem; border-radius:3rem; color:white; text-decoration:none; font-weight:600; font-size: 0.9rem; transition: 0.3s; display: inline-flex; align-items: center; gap: 0.5rem; touch-action: manipulation; }
    .btn:hover { background:#6c63ff; border-color:#6c63ff; box-shadow:0 10px 25px #6c63ffaa; transform: translateX(-3px); }

    .lang-switch { display: flex; gap: 0.4rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 3rem; padding: 0.3rem; backdrop-filter: blur(10px); }
    .lang-btn { background: transparent; border: none; color: #cfc8ff; font-family: inherit; font-weight: 600; font-size: 0.9rem; padding: 0.5rem 1rem; border-radius: 3rem; transition: all 0.3s ease; letter-spacing: 0.5px; display: inline-flex; align-items: center; gap: 0.4rem; touch-action: manipulation; cursor: pointer; }
    .lang-btn:hover:not(.active) { background: rgba(108,99,255,0.2); color: #fff; }
    .lang-btn.active { background: #6c63ff; color: #fff; box-shadow: 0 4px 15px #6c63ffaa; }
    .lang-btn .flag { font-size: 1.05rem; line-height: 1; }

    .page-title { font-size: 2.5rem; margin-bottom: 2rem; font-family: 'Space Grotesk', sans-serif; color: #fff; text-align: center; }

    /* ======== ПЛАШКА "ВКЛЮЧИТЕ УВЕДОМЛЕНИЯ" ======== */
    .notify-banner {
      background: linear-gradient(135deg, rgba(108,99,255,0.15), rgba(179,136,255,0.1));
      border: 1px solid rgba(108,99,255,0.5);
      border-radius: 1.5rem;
      padding: 1.5rem 2rem;
      margin-bottom: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      flex-wrap: wrap;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(-30px);
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      margin-bottom: 0;
      transition: all 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .notify-banner.visible {
      opacity: 1;
      transform: translateY(0);
      max-height: 200px;
      padding-top: 1.5rem;
      padding-bottom: 1.5rem;
      margin-bottom: 2.5rem;
    }
    .notify-banner::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(179,136,255,0.15) 0%, transparent 50%);
      animation: notifyGlow 4s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes notifyGlow {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(20px, 20px); }
    }
    
    .notify-banner-content {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex: 1 1 300px;
      position: relative;
      z-index: 1;
    }
    
    .notify-icon {
      width: 50px;
      height: 50px;
      flex-shrink: 0;
      background: linear-gradient(135deg, #6c63ff, #b388ff);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: #fff;
      animation: bellFloat 2.5s ease-in-out infinite;
      box-shadow: 0 10px 25px rgba(108,99,255,0.5);
    }
    @keyframes bellFloat {
      0%, 100% { transform: translateY(0) rotate(0); }
      25% { transform: translateY(-4px) rotate(-8deg); }
      75% { transform: translateY(-4px) rotate(8deg); }
    }
    
    .notify-text {
      flex: 1;
    }
    .notify-text strong {
      display: block;
      color: #fff;
      font-size: 1.05rem;
      margin-bottom: 0.3rem;
      font-family: 'Space Grotesk', sans-serif;
    }
    .notify-text span {
      color: #c0c5e0;
      font-size: 0.9rem;
    }
    
    .notify-actions {
      display: flex;
      gap: 0.8rem;
      align-items: center;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }
    
    .notify-enable-btn {
      background: linear-gradient(135deg, #6c63ff, #b388ff);
      border: none;
      color: #fff;
      padding: 0.8rem 1.6rem;
      border-radius: 3rem;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 10px 25px rgba(108,99,255,0.5);
      touch-action: manipulation;
      white-space: nowrap;
    }
    .notify-enable-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 15px 35px rgba(108,99,255,0.8);
    }
    .notify-enable-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .notify-close-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.15);
      color: #c0c5e0;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      flex-shrink: 0;
    }
    .notify-close-btn:hover {
      background: rgba(255,255,255,0.15);
      color: #fff;
      transform: rotate(90deg);
    }

    /* ======== КНОПКА "НОВЫЕ ПОСТЫ" ======== */
    .new-posts-pill {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(-150px);
      background: linear-gradient(135deg, #6c63ff, #b388ff);
      color: #fff;
      padding: 0.8rem 1.8rem;
      border-radius: 3rem;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      z-index: 9999;
      box-shadow: 0 10px 30px rgba(108,99,255,0.6);
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      opacity: 0;
      border: none;
      font-family: inherit;
      pointer-events: none;
    }
    .new-posts-pill.visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
    .new-posts-pill:hover { transform: translateX(-50%) translateY(-3px) scale(1.05); }
    .new-posts-pill i { animation: bell-shake 2s infinite; }
    @keyframes bell-shake {
      0%, 80%, 100% { transform: rotate(0); }
      85% { transform: rotate(-15deg); }
      90% { transform: rotate(15deg); }
      95% { transform: rotate(-10deg); }
    }

    /* ======== КАРТОЧКИ ПОСТОВ ======== */
    .post-card { 
      background: rgba(18,20,28,0.65); 
      border: 1px solid rgba(255,255,255,0.08); 
      border-radius: 1.5rem; 
      padding: 2.5rem; 
      margin-bottom: 2.5rem; 
      backdrop-filter: blur(20px); 
      -webkit-backdrop-filter: blur(20px); 
      transition: all 0.4s ease; 
      position: relative; 
      overflow: hidden; 
      opacity: 0; 
      transform: translateY(40px);
    }
    .post-card::before { 
      content:''; 
      position:absolute; 
      inset:0; 
      border-radius:1.5rem; 
      padding:1px; 
      background:linear-gradient(135deg, #b388ff, #6c63ff); 
      -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); 
      -webkit-mask-composite: xor; 
      mask-composite: exclude; 
      opacity:0; 
      transition: opacity 0.4s; 
      pointer-events: none;
    }
    .post-card:hover::before { opacity: 1; }
    .post-card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(108,99,255,0.15); }
    
    .post-card.appear {
      animation: postAppear 0.7s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
    }
    @keyframes postAppear {
      0% { opacity: 0; transform: translateY(40px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    
    .post-card.new-post {
      animation: newPostAppear 1s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
    }
    @keyframes newPostAppear {
      0% { 
        opacity: 0; 
        transform: translateY(-40px) scale(0.85); 
        box-shadow: 0 0 0 0 rgba(179,136,255,0); 
        border-color: rgba(179,136,255,0);
      }
      40% { 
        opacity: 1; 
        transform: translateY(0) scale(1.03); 
        box-shadow: 0 0 50px 10px rgba(179,136,255,0.5); 
        border-color: #b388ff;
      }
      70% { transform: translateY(0) scale(0.99); }
      100% { 
        opacity: 1; 
        transform: translateY(0) scale(1); 
        box-shadow: 0 0 0 0 rgba(179,136,255,0); 
        border-color: rgba(255,255,255,0.08);
      }
    }
    
    .post-card.highlighted {
      animation: highlightPulse 2.5s ease-out;
    }
    @keyframes highlightPulse {
      0% { box-shadow: 0 0 0 0 rgba(179,136,255,0); }
      15% { box-shadow: 0 0 70px 20px rgba(179,136,255,0.7); border-color: #b388ff; }
      50% { box-shadow: 0 0 70px 20px rgba(179,136,255,0.7); border-color: #b388ff; }
      100% { box-shadow: 0 0 0 0 rgba(179,136,255,0); }
    }
    
    .post-date { font-size: 0.85rem; color: #b388ff; font-weight: 600; margin-bottom: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
    .post-title { font-family: 'Space Grotesk', sans-serif; font-size: 2rem; color: #fff; margin-bottom: 1.2rem; line-height: 1.3; }
    .post-content { color: #c0c5e0; font-size: 1.1rem; margin-bottom: 2rem; white-space: pre-wrap; }
    
    .post-actions { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 1.5rem; flex-wrap: wrap; gap: 1rem; }
    .like-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #e8e9f0; padding: 0.6rem 1.5rem; border-radius: 3rem; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; font-size: 1rem; transition: 0.3s; font-family: inherit; touch-action: manipulation; }
    .like-btn:hover { background: rgba(108,99,255,0.2); border-color: #6c63ff; }
    .like-btn.liked { color: #ff4444; border-color: #ff4444; background: rgba(255,68,68,0.1); }
    .like-btn.liked i { transform: scale(1.2); }
    .like-btn i { transition: 0.3s; }
    
    .post-link-btn { color: #b388ff; text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; transition: 0.3s; }
    .post-link-btn:hover { color: #fff; gap: 0.8rem; }

    .loader { text-align: center; padding: 3rem; color: #b388ff; font-size: 1.2rem; }
    .no-posts { text-align: center; padding: 3rem; color: #7a7f9a; font-size: 1.1rem; }

    @media (max-width: 768px) {
      .container { padding: 1.5rem; }
      .post-card { padding: 2rem 1.5rem; border-radius: 1.2rem; }
      .post-title { font-size: 1.6rem; }
      header { flex-direction: column; text-align: center; margin-bottom: 2rem; }
      .header-right { justify-content: center; width: 100%; }
      .post-actions { flex-direction: column; align-items: flex-start; gap: 1rem; }
      .new-posts-pill { top: 20px; font-size: 0.85rem; padding: 0.7rem 1.3rem; }
      .notify-banner { padding: 1.2rem; }
      .notify-banner-content { flex-direction: column; text-align: center; gap: 0.8rem; }
      .notify-actions { flex-direction: column; width: 100%; }
      .notify-enable-btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <canvas id="bgCanvas"></canvas>
  
  <button class="new-posts-pill" id="newPostsPill">
    <i class="fas fa-bell"></i>
    <span id="newPostsText">Новые посты</span>
  </button>
  
  <div class="container">
    <header>
      <a href="../index.html" class="logo">MrKronick</a>
      <div class="header-right">
        <div class="lang-switch" role="group" aria-label="Language">
          <button class="lang-btn" data-lang="ru"><span class="flag">🇷🇺</span> RU</button>
          <button class="lang-btn" data-lang="en"><span class="flag">🇬🇧</span> EN</button>
          <button class="lang-btn" data-lang="zh"><span class="flag">🇨🇳</span> 中文</button>
        </div>
        <a href="../index.html" class="btn"><i class="fas fa-arrow-left"></i> <span data-i18n="back_btn">На главную</span></a>
      </div>
    </header>

    <!-- ПЛАШКА ВКЛЮЧИТЬ УВЕДОМЛЕНИЯ -->
    <div class="notify-banner" id="notifyBanner">
      <div class="notify-banner-content">
        <div class="notify-icon"><i class="fas fa-bell"></i></div>
        <div class="notify-text">
          <strong data-i18n="notify_title">Включите уведомления</strong>
          <span data-i18n="notify_subtitle">Получайте свежие посты первыми!</span>
        </div>
      </div>
      <div class="notify-actions">
        <button class="notify-enable-btn" id="notifyEnableBtn">
          <i class="fas fa-bell"></i> <span data-i18n="notify_enable_btn">Включить уведомления</span>
        </button>
        <button class="notify-close-btn" id="notifyCloseBtn" aria-label="Close">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>

    <h1 class="page-title" data-i18n="page_title">Посты</h1>

    <div id="posts-container">
      <div class="loader"><i class="fas fa-spinner fa-spin"></i> <span data-i18n="loading">Загрузка...</span></div>
    </div>
  </div>

  <script>
    const API_URL = 'https://api.mrkronick.site';
    const WORKER_URL = 'https://api.mrkronick.site';
    const VAPID_PUBLIC_KEY = 'BEQUS1Qg5HToCnZT5L1SeTmolZ2KYoMm70Sm48oUxzxXIVwSg_r5X-iu9VVJr8BEBwFy02ZOKn6DhxEDuiE7n1A';
    const POLL_INTERVAL = 15000;
    const NOTIFY_DISMISSED_KEY = 'notify_banner_dismissed';

    const translations = {
      ru: {
        page_title: "Посты",
        back_btn: "На главную",
        loading: "Загрузка...",
        no_posts: "Постов пока нет.",
        error: "Ошибка сети. Попробуйте позже.",
        link_btn_default: "Перейти по ссылке",
        new_post_single: "Новый пост",
        new_posts_plural: "Новых постов",
        notify_title: "Включите уведомления",
        notify_subtitle: "Получайте свежие посты первыми!",
        notify_enable_btn: "Включить уведомления",
        notify_enabled: "Уведомления включены!",
        notify_connecting: "Подключаем..."
      },
      en: {
        page_title: "Posts",
        back_btn: "Back to Home",
        loading: "Loading...",
        no_posts: "No posts yet.",
        error: "Network error. Please try again later.",
        link_btn_default: "Go to link",
        new_post_single: "New post",
        new_posts_plural: "New posts",
        notify_title: "Enable notifications",
        notify_subtitle: "Get fresh posts first!",
        notify_enable_btn: "Enable notifications",
        notify_enabled: "Notifications enabled!",
        notify_connecting: "Connecting..."
      },
      zh: {
        page_title: "帖子",
        back_btn: "返回首页",
        loading: "加载中...",
        no_posts: "暂时没有帖子。",
        error: "网络错误，请稍后再试。",
        link_btn_default: "前往链接",
        new_post_single: "新帖子",
        new_posts_plural: "新帖子",
        notify_title: "启用通知",
        notify_subtitle: "第一时间收到最新帖子！",
        notify_enable_btn: "启用通知",
        notify_enabled: "通知已启用！",
        notify_connecting: "连接中..."
      }
    };

    function detectLanguage() {
      const saved = localStorage.getItem('lang');
      if (saved && translations[saved]) return saved;
      const candidates = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
      for (const c of candidates) {
        const code = String(c).toLowerCase();
        if (code.startsWith('ru')) return 'ru';
        if (code.startsWith('zh')) return 'zh';
      }
      return 'en';
    }

    let currentLang = detectLanguage();
    let globalLikesCache = {};
    let knownPostIds = new Set();
    let firstLoad = true;
    let pendingNewPosts = [];
    let pollTimer = null;

    function applyLang(lang) {
      const t = translations[lang];
      if (!t) return;
      currentLang = lang;
      localStorage.setItem('lang', lang);
      document.documentElement.lang = lang;
      
      const titleEl = document.querySelector('title');
      if(titleEl) titleEl.textContent = t.page_title + " | MrKronick";

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key] !== undefined) el.textContent = t[key];
      });

      document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
      
      knownPostIds.clear();
      firstLoad = true;
      pendingNewPosts = [];
      hidePill();
      loadPosts();
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => applyLang(btn.dataset.lang));
    });

    // ======== ПЛАШКА УВЕДОМЛЕНИЙ ========
    const notifyBanner = document.getElementById('notifyBanner');
    const notifyEnableBtn = document.getElementById('notifyEnableBtn');
    const notifyCloseBtn = document.getElementById('notifyCloseBtn');

    async function checkNotifyStatus() {
      // Не показываем, если юзер уже закрыл
      if (localStorage.getItem(NOTIFY_DISMISSED_KEY) === 'true') return;
      
      // Не показываем в браузерах без поддержки
      if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return;
      
      // Не показываем если запрещено в браузере
      if (Notification.permission === 'denied') return;
      
      // На iOS без PWA показываем с подсказкой (или не показываем)
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      if (isIOS && !isStandalone) return;
      
      try {
        const registration = await navigator.serviceWorker.ready;
        const subscription = await registration.pushManager.getSubscription();
        
        if (subscription) {
          // Уже подписан — не показываем
          return;
        }
        
        // Показываем плашку с задержкой для красоты
        setTimeout(() => {
          notifyBanner.classList.add('visible');
        }, 1200);
      } catch (e) {
        // Если ошибка — тоже покажем (может, сервис-воркер не активен)
        setTimeout(() => {
          notifyBanner.classList.add('visible');
        }, 1200);
      }
    }

    notifyCloseBtn.addEventListener('click', () => {
      notifyBanner.classList.remove('visible');
      // Запоминаем, что закрыл (на 7 дней)
      const expires = Date.now() + 7 * 24 * 60 * 60 * 1000;
      localStorage.setItem(NOTIFY_DISMISSED_KEY, JSON.stringify(expires));
    });

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
      return outputArray;
    }

    notifyEnableBtn.addEventListener('click', async () => {
      const t = translations[currentLang];
      const originalHTML = notifyEnableBtn.innerHTML;
      
      try {
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') {
          alert(t.notify_subtitle);
          return;
        }

        notifyEnableBtn.disabled = true;
        notifyEnableBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${t.notify_connecting}`;

        await navigator.serviceWorker.register('/sw.js');
        const registration = await Promise.race([
          navigator.serviceWorker.ready,
          new Promise((_, reject) => setTimeout(() => reject(new Error('SW timeout')), 15000))
        ]);

        let subscription = await registration.pushManager.getSubscription();
        if (!subscription) {
          const applicationServerKey = urlBase64ToUint8Array(VAPID_PUBLIC_KEY);
          subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: applicationServerKey
          });
        }

        const response = await fetch(WORKER_URL + '/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(subscription)
        });

        if (!response.ok) throw new Error('Server error');

        notifyEnableBtn.innerHTML = `<i class="fas fa-check"></i> ${t.notify_enabled}`;
        notifyEnableBtn.style.background = 'linear-gradient(135deg, #4caf50, #8bc34a)';
        notifyEnableBtn.style.boxShadow = '0 10px 25px rgba(76, 175, 80, 0.5)';
        
        setTimeout(() => {
          notifyBanner.classList.remove('visible');
        }, 2000);
      } catch (e) {
        console.error('Notify error:', e);
        notifyEnableBtn.disabled = false;
        notifyEnableBtn.innerHTML = originalHTML;
        alert('Error: ' + e.message);
      }
    });

    // Проверка на закрытие (если истёк срок — показываем снова)
    const dismissedData = localStorage.getItem(NOTIFY_DISMISSED_KEY);
    if (dismissedData) {
      const ts = parseInt(dismissedData);
      if (!isNaN(ts) && Date.now() > ts) {
        localStorage.removeItem(NOTIFY_DISMISSED_KEY);
      }
    }
    checkNotifyStatus();

    // ======== ПИЛЮЛЯ "НОВЫЕ ПОСТЫ" ========
    function updatePillText() {
      const t = translations[currentLang];
      const textEl = document.getElementById('newPostsText');
      const count = pendingNewPosts.length;
      if (count === 1) {
        textEl.textContent = t.new_post_single;
      } else {
        textEl.textContent = `${t.new_posts_plural} (${count})`;
      }
    }

    function showPill() {
      updatePillText();
      document.getElementById('newPostsPill').classList.add('visible');
    }

    function hidePill() {
      document.getElementById('newPostsPill').classList.remove('visible');
    }

    function createPostCard(post, likes, t, animationType = 'appear', delay = 0) {
      const userLiked = localStorage.getItem(`liked_${post.id}`) === 'true';
      const displayCount = userLiked ? Math.max(likes[post.id] || 0, 1) : (likes[post.id] || 0);
      
      const card = document.createElement('div');
      card.className = `post-card ${animationType}`;
      card.dataset.postId = post.id;
      if (delay > 0) card.style.animationDelay = `${delay}s`;
      
      let linkHtml = '';
      if (post.link && post.link.trim() !== '') {
        const btnText = (post.linkText && post.linkText.trim() !== '') ? post.linkText : t.link_btn_default;
        linkHtml = `<a href="${post.link}" target="_blank" class="post-link-btn">${btnText} <i class="fas fa-arrow-right"></i></a>`;
      }

      card.innerHTML = `
        <div class="post-date">${post.date}</div>
        <h2 class="post-title">${post.title}</h2>
        <div class="post-content">${post.content}</div>
        <div class="post-actions">
          <button class="like-btn ${userLiked ? 'liked' : ''}" onclick="toggleLike(this, '${post.id}')">
            <i class="${userLiked ? 'fas' : 'far'} fa-heart"></i>
            <span class="like-count">${displayCount}</span>
          </button>
          ${linkHtml}
        </div>
      `;
      return card;
    }

    function insertNewPosts(posts) {
      const t = translations[currentLang];
      const container = document.getElementById('posts-container');
      
      const placeholder = container.querySelector('.no-posts');
      if (placeholder) placeholder.remove();
      
      posts.forEach((post, i) => {
        knownPostIds.add(post.id);
        const card = createPostCard(post, globalLikesCache, t, 'new-post');
        card.style.animationDelay = `${i * 0.15}s`;
        container.insertBefore(card, container.querySelector('.post-card') || null);
      });
    }

    async function loadPosts() {
      const t = translations[currentLang];
      const container = document.getElementById('posts-container');
      
      try {
        const [postsRes, likesRes] = await Promise.all([
          fetch(API_URL + '/posts'),
          fetch(API_URL + '/likes')
        ]);
        const posts = await postsRes.json();
        const likes = await likesRes.json();
        globalLikesCache = likes;

        if (firstLoad) {
          container.innerHTML = '';
          knownPostIds.clear();
          
          if (posts.length === 0) {
            container.innerHTML = `<div class="no-posts">${t.no_posts}</div>`;
            firstLoad = false;
            return;
          }

          posts.forEach((post, index) => {
            knownPostIds.add(post.id);
            const card = createPostCard(post, likes, t, 'appear', index * 0.1);
            container.appendChild(card);
          });
          firstLoad = false;
          
          handleHashScroll();
        } else {
          const newPosts = posts.filter(p => !knownPostIds.has(p.id));
          
          if (newPosts.length > 0) {
            document.querySelectorAll('.post-card').forEach(card => {
              if (!posts.some(p => p.id === card.dataset.postId)) {
                card.style.transition = 'opacity 0.3s, transform 0.3s';
                card.style.opacity = '0';
                card.style.transform = 'translateX(-60px)';
                setTimeout(() => card.remove(), 300);
              }
            });
            
            const isAtTop = window.scrollY < 200;
            
            if (isAtTop) {
              insertNewPosts(newPosts);
            } else {
              pendingNewPosts.push(...newPosts);
              newPosts.forEach(p => knownPostIds.add(p.id));
              showPill();
            }
          }
        }
      } catch (e) {
        console.error('Load error:', e);
        if (firstLoad) {
          container.innerHTML = `<div class="no-posts" style="color: #ff4444;">${t.error}</div>`;
        }
      }
    }

    function handleHashScroll() {
      const hash = window.location.hash;
      if (!hash.startsWith('#post-')) return;
      
      const postId = hash.replace('#post-', '');
      setTimeout(() => {
        const card = document.querySelector(`[data-post-id="${postId}"]`);
        if (card) {
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
          setTimeout(() => {
            card.classList.add('highlighted');
            setTimeout(() => card.classList.remove('highlighted'), 3000);
          }, 600);
        }
      }, 400);
    }

    window.addEventListener('hashchange', handleHashScroll);

    document.getElementById('newPostsPill').addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      hidePill();
      
      if (pendingNewPosts.length > 0) {
        insertNewPosts(pendingNewPosts);
        pendingNewPosts = [];
        
        setTimeout(() => {
          document.querySelectorAll('.post-card.new-post').forEach((card, i) => {
            setTimeout(() => {
              card.classList.add('highlighted');
              setTimeout(() => card.classList.remove('highlighted'), 2500);
            }, i * 200);
          });
        }, 800);
      }
    });

    window.addEventListener('scroll', () => {
      if (window.scrollY < 100 && pendingNewPosts.length > 0) {
        insertNewPosts(pendingNewPosts);
        pendingNewPosts = [];
        hidePill();
      }
    });

    async function toggleLike(btn, postId) {
      if (btn.classList.contains('liked')) return;
      const icon = btn.querySelector('i');
      const countSpan = btn.querySelector('.like-count');
      
      btn.classList.add('liked');
      icon.classList.replace('far', 'fas');
      countSpan.textContent = parseInt(countSpan.textContent) + 1;
      localStorage.setItem(`liked_${postId}`, 'true');
      
      try {
        const res = await fetch(API_URL + '/like', { 
          method: 'POST', 
          headers: { 'Content-Type': 'application/json' }, 
          body: JSON.stringify({ postId }) 
        });
        if (!res.ok) throw new Error('Server error');
      } catch (e) {
        console.error('Like error:', e);
        btn.classList.remove('liked');
        icon.classList.replace('fas', 'far');
        countSpan.textContent = parseInt(countSpan.textContent) - 1;
        localStorage.removeItem(`liked_${postId}`);
      }
    }

    // Инициализация
    applyLang(currentLang);

    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(() => {
        if (!firstLoad && document.visibilityState === 'visible') {
          loadPosts();
        }
      }, POLL_INTERVAL);
    }
    
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && !firstLoad) {
        loadPosts();
      }
    });
    
    startPolling();

    // Фоновая анимация частиц
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];
    
    function resizeCanvas() { width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() { this.reset(); }
      reset() { this.x = Math.random() * width; this.y = Math.random() * height; this.radius = Math.random() * 2 + 1; this.speedX = (Math.random() - 0.5) * 0.2; this.speedY = (Math.random() - 0.5) * 0.2; this.opacity = Math.random() * 0.5 + 0.1; }
      update() { this.x += this.speedX; this.y += this.speedY; if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) this.reset(); }
      draw(ctx) { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius*2); gradient.addColorStop(0, `rgba(179,136,255,${this.opacity})`); gradient.addColorStop(1, 'rgba(108,99,255,0)'); ctx.fillStyle = gradient; ctx.fill(); }
    }
    for (let i = 0; i < 50; i++) particles.push(new Particle());
    
    function animate() {
      ctx.clearRect(0, 0, width, height);
      for (let p of particles) { p.update(); p.draw(ctx); }
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
