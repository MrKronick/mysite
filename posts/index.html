<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Посты | MrKronick</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: #6c63ff; border-radius: 10px; }
    body { font-family: 'Inter', sans-serif; background: #0a0a0f; color: #e8e9f0; line-height: 1.6; min-height: 100vh; }
    .container { max-width: 800px; margin: 0 auto; padding: 2rem; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 2rem; border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 3rem; }
    .logo { font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:2rem; background: linear-gradient(135deg, #fff, #b388ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
    .btn { background:rgba(108,99,255,0.2); border:1px solid rgba(108,99,255,0.5); padding:0.6rem 1.5rem; border-radius:3rem; color:white; text-decoration:none; font-weight:600; font-size: 0.9rem; transition: 0.3s; }
    .btn:hover { background:#6c63ff; box-shadow: 0 5px 15px rgba(108,99,255,0.4); }
    .post-card { background: rgba(18,20,28,0.65); border: 1px solid rgba(255,255,255,0.08); border-radius: 1.5rem; padding: 2.5rem; margin-bottom: 2.5rem; backdrop-filter: blur(10px); transition: 0.3s; }
    .post-card:hover { border-color: rgba(108,99,255,0.4); }
    .post-date { font-size: 0.85rem; color: #b388ff; font-weight: 600; margin-bottom: 0.8rem; text-transform: uppercase; }
    .post-title { font-family: 'Space Grotesk', sans-serif; font-size: 2rem; color: #fff; margin-bottom: 1.2rem; }
    .post-content { color: #c0c5e0; font-size: 1.1rem; margin-bottom: 2rem; white-space: pre-wrap; }
    .post-actions { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 1.5rem; flex-wrap: wrap; gap: 1rem; }
    .like-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #e8e9f0; padding: 0.6rem 1.5rem; border-radius: 3rem; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; font-size: 1rem; transition: 0.3s; font-family: inherit; }
    .like-btn:hover { background: rgba(108,99,255,0.2); }
    .like-btn.liked { color: #ff4444; border-color: #ff4444; background: rgba(255,68,68,0.1); }
    .post-link-btn { color: #b388ff; text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; transition: 0.3s; }
    .post-link-btn:hover { color: #fff; gap: 0.8rem; }
    .loader { text-align: center; padding: 3rem; color: #b388ff; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="../index.html" class="logo">MrKronick</a>
      <a href="../index.html" class="btn"><i class="fas fa-arrow-left"></i> На главную</a>
    </header>
    <div id="posts-container">
      <div class="loader"><i class="fas fa-spinner fa-spin"></i> Загрузка...</div>
    </div>
  </div>

  <script>
    // Если ты на русском сайте, оставь этот URL. Для международного используй api.mrkronick.site
    const API_URL = 'https://api.mrkronick.site'; 

    async function loadPosts() {
      try {
        const res = await fetch(API_URL + '/posts');
        const posts = await res.json();
        const likesRes = await fetch(API_URL + '/likes');
        const globalLikes = await likesRes.json();

        const container = document.getElementById('posts-container');
        container.innerHTML = '';

        if (posts.length === 0) {
          container.innerHTML = '<p style="text-align:center;color:#7a7f9a;">Постов пока нет.</p>';
          return;
        }

        posts.forEach((post) => {
          const userLiked = localStorage.getItem(`liked_${post.id}`) === 'true';
          const likesCount = globalLikes[post.id] || 0;

          const card = document.createElement('div');
          card.className = 'post-card';
          
          let linkHtml = '';
          if (post.link && post.link.trim() !== '') {
            const btnText = (post.linkText && post.linkText.trim() !== '') ? post.linkText : 'Перейти по ссылке';
            linkHtml = `<a href="${post.link}" target="_blank" class="post-link-btn">${btnText} <i class="fas fa-arrow-right"></i></a>`;
          }

          card.innerHTML = `
            <div class="post-date">${post.date}</div>
            <h2 class="post-title">${post.title}</h2>
            <div class="post-content">${post.content}</div>
            <div class="post-actions">
              <button class="like-btn ${userLiked ? 'liked' : ''}" onclick="toggleLike(this, '${post.id}')">
                <i class="${userLiked ? 'fas' : 'far'} fa-heart"></i>
                <span class="like-count">${likesCount}</span>
              </button>
              ${linkHtml}
            </div>
          `;
          container.appendChild(card);
        });
      } catch (e) {
        document.getElementById('posts-container').innerHTML = '<p style="text-align:center;color:red;">Ошибка сети. Попробуйте позже.</p>';
      }
    }

    async function toggleLike(btn, postId) {
      if (btn.classList.contains('liked')) return;
      const icon = btn.querySelector('i');
      const countSpan = btn.querySelector('.like-count');
      btn.classList.add('liked');
      icon.classList.replace('far', 'fas');
      countSpan.textContent = parseInt(countSpan.textContent) + 1;
      localStorage.setItem(`liked_${postId}`, 'true');
      try {
        await fetch(API_URL + '/like', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ postId }) });
      } catch (e) {}
    }

    loadPosts();
  </script>
</body>
</html>
