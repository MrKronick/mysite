  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      cursor: url("images/cursor-sword.png") 16 2, auto;
      font-family: 'Inter', sans-serif;
      background: #0a0a0f;
      color: #e8e9f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    a, button, .btn, .social-icon, .social-card, .badge, .project-card, .scroll-reveal, .logo, input, select, textarea, [role="button"], .clickable {
      cursor: url("images/cursor-pickaxe.png") 14 4, pointer;
    }
    .container {
      text-align: center;
      position: relative;
      z-index: 2;
    }
    .language-grid {
      display: flex;
      gap: 3rem;
      justify-content: center;
      margin-top: 3rem;
      flex-wrap: wrap;
    }
    .lang-card {
      background: rgba(18, 20, 28, 0.65);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 2.5rem;
      padding: 3rem 2.5rem;
      text-decoration: none;
      color: #e8e9f0;
      transition: all 0.45s cubic-bezier(0.25, 0.8, 0.25, 1.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      box-shadow: 0 20px 45px rgba(0,0,0,0.6);
      width: 250px;
    }
    .lang-card:hover {
      transform: translateY(-15px) scale(1.03);
      background: rgba(108,99,255,0.15);
      border-color: #6c63ff;
      box-shadow: 0 35px 65px #6c63ff66;
    }
    .lang-flag {
      font-size: 4rem;
    }
    .lang-name {
      font-size: 2rem;
      font-weight: 700;
      font-family: 'Space Grotesk', sans-serif;
    }
    .gradient-text {
      background: linear-gradient(135deg, #b388ff, #6c63ff, #3f8cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 3rem;
      background: linear-gradient(135deg, #fff, #b388ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 15px rgba(179,136,255,0.7));
      margin-bottom: 1rem;
    }
    /* Фоновые частицы (упрощённо) */
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      opacity: 0.5;
    }
  </style>

  <style>
    body {
      background:
        radial-gradient(circle at 15% 15%,rgba(139,124,255,.16),transparent 28%),
        radial-gradient(circle at 85% 75%,rgba(63,140,255,.11),transparent 28%),#07070b;
    }
    .container { max-width:900px !important; }
    .container::before {
      content:"";position:absolute;width:420px;height:420px;left:50%;top:50%;
      transform:translate(-50%,-50%);border:1px solid rgba(139,124,255,.12);
      border-radius:50%;box-shadow:0 0 120px rgba(108,99,255,.08);pointer-events:none;
    }
    .language-grid { gap:1.25rem !important; }
    .lang-card {
      width:min(290px,42vw) !important;min-height:230px;justify-content:center;
      position:relative;overflow:hidden;
    }
    .lang-card::after {
      content:"";position:absolute;width:130px;height:130px;right:-55px;top:-55px;border-radius:50%;
      background:radial-gradient(circle,rgba(179,136,255,.28),transparent 70%);pointer-events:none;
    }
    .lang-card:hover { transform:translateY(-10px) scale(1.025) !important; }
    .hint { margin-top:1.5rem;color:#8e93aa;font-size:.85rem;letter-spacing:.05em; }
    @media(max-width:600px){ .lang-card{width:100% !important;} }
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{animation:none !important;transition:none !important}
    }
  </style>
</head>
<body>
  <canvas id="bgCanvas"></canvas>
  <div class="container">
    <div class="logo">MrKronick</div>
    <p style="font-size: 1.2rem; opacity: 0.7;">Выберите язык / Choose language</p>
    <div class="hint">MRKRONICK / OFFICIAL HUB</div>
    <div class="language-grid">
      <a href="ru.html" class="lang-card">
        <span class="lang-flag">🇷🇺</span>
        <span class="lang-name">Русский</span>
      </a>
      <a href="en.html" class="lang-card">
        <span class="lang-flag">🇬🇧</span>
        <span class="lang-name">English</span>
      </a>
    </div>
  </div>
  <script>
    (function() {
      const canvas = document.getElementById('bgCanvas');
      const ctx = canvas.getContext('2d');
      let w, h;
      let particles = [];
      const PARTICLE_COUNT = 60;
      function resize() {
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = w;
        canvas.height = h;
      }
      window.addEventListener('resize', resize);
      resize();
      class Particle {
        constructor() { this.reset(); }
        reset() {
          this.x = Math.random() * w;
          this.y = Math.random() * h;
          this.radius = Math.random() * 2.5 + 0.5;
          this.speedX = (Math.random() - 0.5) * 0.3;
          this.speedY = (Math.random() - 0.5) * 0.3;
          this.opacity = Math.random() * 0.5 + 0.2;
        }
        update() {
          this.x += this.speedX;
          this.y += this.speedY;
          if (this.x < 0 || this.x > w || this.y < 0 || this.y > h) this.reset();
        }
        draw(ctx) {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
          ctx.fillStyle = `rgba(179,136,255,${this.opacity})`;
          ctx.fill();
        }
      }
      for (let i=0; i<PARTICLE_COUNT; i++) particles.push(new Particle());
      function animate() {
        ctx.clearRect(0,0,w,h);
        particles.forEach(p => { p.update(); p.draw(ctx); });
        requestAnimationFrame(animate);
      }
      animate();
      window.addEventListener('mousemove', (e) => {
        particles.forEach(p => {
          const dx = p.x - e.clientX;
          const dy = p.y - e.clientY;
          if (Math.sqrt(dx*dx+dy*dy) < 100) {
            p.speedX += dx * 0.002;
            p.speedY += dy * 0.002;
          }
        });
      });
    })();
  </script>
</body>
