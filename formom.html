<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С днём рождения, любимая мама!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Marck+Script&family=Philosopher:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Philosopher', sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 25%, #fdf2e9 50%, #fadbd8 75%, #fce4ec 100%);
            background-size: 400% 400%;
            animation: gradientShift 18s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            cursor: default;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            25% { background-position: 100% 0%; }
            50% { background-position: 100% 100%; }
            75% { background-position: 0% 100%; }
            100% { background-position: 0% 50%; }
        }

        .petal {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            animation: fall linear forwards;
            opacity: 0.8;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg) scale(1); opacity: 0.9; }
            70% { opacity: 0.7; }
            100% { transform: translateY(110vh) rotate(720deg) scale(0.3); opacity: 0; }
        }

        .main-container {
            position: relative;
            z-index: 10;
            width: 95%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding: 20px;
        }

        .header {
            text-align: center;
            animation: fadeInDown 1.2s ease-out;
        }
        .header .greeting {
            font-family: 'Marck Script', cursive;
            font-size: clamp(2.5rem, 8vw, 5rem);
            color: #b34180;
            text-shadow: 3px 3px 6px rgba(180, 65, 128, 0.25);
            line-height: 1.2;
            letter-spacing: 2px;
        }
        .header .age-badge {
            display: inline-block;
            background: linear-gradient(135deg, #e91e63, #c2185b);
            color: #fff;
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 700;
            padding: 12px 32px;
            border-radius: 60px;
            margin-top: 12px;
            box-shadow: 0 8px 25px rgba(233, 30, 99, 0.4);
            animation: pulse 2s infinite;
            letter-spacing: 3px;
            position: relative;
        }
        .age-badge::after {
            content: '✨';
            position: absolute;
            top: -18px;
            right: -18px;
            font-size: 2rem;
            animation: twinkle 1.5s infinite;
        }
        .age-badge::before {
            content: '✨';
            position: absolute;
            bottom: -18px;
            left: -18px;
            font-size: 1.6rem;
            animation: twinkle 1.5s infinite 0.5s;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3); }
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-carousel {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 420px;
            perspective: 1200px;
        }
        .card-wrapper {
            position: absolute;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.6s ease, filter 0.6s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            will-change: transform, opacity;
        }
        .card {
            width: 90%;
            height: 100%;
            background: #fffef9;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(180, 65, 128, 0.1);
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: box-shadow 0.4s;
            border: 2px solid #f8bbd0;
        }
        .card:hover {
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2), 0 0 0 2px #e91e63;
        }
        .card::before {
            content: '';
            position: absolute;
            top: -30px;
            right: -30px;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(233, 30, 99, 0.08) 0%, transparent 70%);
            border-radius: 50%;
        }
        .card::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: -20px;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(255, 183, 77, 0.1) 0%, transparent 70%);
            border-radius: 50%;
        }
        .card-icon {
            font-size: 4rem;
            margin-bottom: 15px;
            animation: floatIcon 3s ease-in-out infinite;
            z-index: 1;
        }
        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: #b34180;
            margin-bottom: 12px;
            z-index: 1;
            line-height: 1.3;
        }
        .card-message {
            font-family: 'Philosopher', sans-serif;
            font-size: 1.1rem;
            color: #5d4037;
            line-height: 1.7;
            z-index: 1;
            max-width: 400px;
            font-style: italic;
        }
        .card-flowers {
            position: absolute;
            font-size: 2rem;
            opacity: 0.5;
            pointer-events: none;
        }
        .card-flowers.top-left { top: 10px; left: 15px; }
        .card-flowers.bottom-right { bottom: 10px; right: 15px; }

        .carousel-nav {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-top: 5px;
        }
        .nav-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: #fff;
            color: #b34180;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.12);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        .nav-btn:hover {
            background: #e91e63;
            color: #fff;
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(233, 30, 99, 0.4);
        }
        .nav-dots { display: flex; gap: 10px; }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #d7ccc8;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        .dot.active {
            background: #e91e63;
            border-color: #fff;
            box-shadow: 0 0 12px rgba(233, 30, 99, 0.6);
            transform: scale(1.3);
        }

        .firework-btn {
            background: linear-gradient(135deg, #ff6f00, #e91e63);
            color: #fff;
            border: none;
            padding: 16px 40px;
            border-radius: 50px;
            font-family: 'Philosopher', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 2px;
            box-shadow: 0 10px 30px rgba(233, 30, 99, 0.5);
            transition: all 0.3s;
            z-index: 20;
            text-transform: uppercase;
        }
        .firework-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(233, 30, 99, 0.7);
        }
        .firework-btn:active { transform: scale(0.95); }

        #fireworkCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .signature {
            font-family: 'Marck Script', cursive;
            font-size: 1.8rem;
            color: #b34180;
            text-align: center;
            opacity: 0.85;
            margin-top: 10px;
            animation: fadeIn 2s ease-out 0.5s both;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 0.85; }
        }

        .candles-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 10;
            margin-top: -10px;
        }
        .candle {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        .candle .flame {
            font-size: 2rem;
            animation: flicker 0.3s infinite alternate;
            transition: all 0.2s;
            filter: drop-shadow(0 0 8px #ff9800);
        }
        .candle .wick { font-size: 1rem; line-height: 1; }
        @keyframes flicker {
            0% { transform: scaleY(1) scaleX(1); opacity: 1; }
            100% { transform: scaleY(1.25) scaleX(0.9); opacity: 0.8; }
        }
        .candle.extinguished .flame {
            opacity: 0;
            transform: scale(0);
            filter: none;
        }
        .candle.extinguished .smoke {
            opacity: 1;
            animation: riseSmoke 1s forwards;
        }
        .smoke {
            position: absolute;
            top: -10px;
            font-size: 0.8rem;
            opacity: 0;
            pointer-events: none;
        }
        @keyframes riseSmoke {
            0% { opacity: 0.7; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-30px) scale(2); }
        }

        @media (max-width: 600px) {
            .card-carousel { height: 380px; }
            .card { padding: 25px 20px; }
            .card-title { font-size: 1.4rem; }
            .card-message { font-size: 0.95rem; }
            .card-icon { font-size: 3rem; }
            .nav-btn { width: 40px; height: 40px; font-size: 1.2rem; }
            .firework-btn { padding: 14px 30px; font-size: 1rem; }
        }
    </style>
</head>
<body>
    <canvas id="fireworkCanvas"></canvas>

    <div class="main-container">
        <div class="header">
            <h1 class="greeting">С днём рождения,<br>любимая мама!</h1>
            <div class="age-badge">53</div>
        </div>

        <div class="card-carousel" id="carousel"></div>

        <div class="carousel-nav">
            <button class="nav-btn" id="prevBtn" aria-label="Предыдущая открытка">❮</button>
            <div class="nav-dots" id="navDots"></div>
            <button class="nav-btn" id="nextBtn" aria-label="Следующая открытка">❯</button>
        </div>

        <div class="candles-row" id="candlesRow"></div>
        <p style="color:#8d6e63; z-index:10; font-style:italic; margin-top:-5px;">Нажми на свечи, чтобы задуть! 🕯️</p>

        <button class="firework-btn" id="fireworkBtn">🎆 Праздничный салют!</button>
        <p class="signature">С любовью, твой самый благодарный ребёнок 💖</p>
    </div>

    <script>
        (function() {
            const cardsData = [
                { icon: '🌸', title: '53 года — прекрасный возраст!', message: 'Это время, когда мудрость встречается с красотой, а сердце полно тепла и нежности. Ты сияешь ярче всех цветов в саду!' },
                { icon: '💐', title: 'Ты — самое дорогое, что у меня есть', message: 'Твоя любовь, забота и бесконечная вера в меня сделали мою жизнь счастливой. Спасибо за каждый тёплый момент.' },
                { icon: '🦋', title: 'Пусть сбудутся все мечты!', message: 'Желаю тебе здоровья крепкого, как алмаз, радости — бесконечной, как небо, и счастья — огромного, как океан!' },
                { icon: '🌹', title: 'Королева нашего сердца', message: 'Ты всегда была и остаёшься для меня примером женственности, силы и доброты. Ты — самая лучшая мама на свете!' },
                { icon: '🎀', title: 'Спасибо за твою улыбку', message: 'Каждая твоя улыбка — как солнечный луч, который согревает даже в самый пасмурный день. Улыбайся чаще, родная!' },
                { icon: '🍰', title: 'Сладкой жизни, как этот торт!', message: 'Пусть каждый новый день приносит только приятные сюрпризы, вкусные моменты и поводы для радости. Ты этого достойна!' }
            ];

            const carousel = document.getElementById('carousel');
            const navDots = document.getElementById('navDots');
            let currentIndex = 0;
            let wrappers = [];

            function createAllCards() {
                carousel.innerHTML = '';
                wrappers = [];
                cardsData.forEach((data, index) => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'card-wrapper';
                    wrapper.dataset.index = index;
                    wrapper.innerHTML = `
                        <div class="card">
                            <span class="card-flowers top-left">🌿</span>
                            <span class="card-flowers bottom-right">✨</span>
                            <div class="card-icon">${data.icon}</div>
                            <h2 class="card-title">${data.title}</h2>
                            <p class="card-message">${data.message}</p>
                        </div>
                    `;
                    carousel.appendChild(wrapper);
                    wrappers.push(wrapper);
                });

                navDots.innerHTML = '';
                cardsData.forEach((_, idx) => {
                    const dot = document.createElement('div');
                    dot.className = 'dot';
                    dot.addEventListener('click', () => goToSlide(idx));
                    navDots.appendChild(dot);
                });
            }

            function updateCarousel() {
                wrappers.forEach((wrapper, idx) => {
                    const offset = idx - currentIndex;
                    const translateX = offset * 100;
                    const scale = offset === 0 ? 1 : 0.85;
                    const rotateY = offset * 8;
                    const transform = `translateX(${translateX}%) scale(${scale}) rotateY(${rotateY}deg)`;

                    let opacity, filter;
                    if (offset === 0) {
                        opacity = 1;
                        filter = 'blur(0)';
                    } else if (Math.abs(offset) === 1) {
                        opacity = 0.75;
                        filter = 'blur(2px)';
                    } else {
                        opacity = 0.4;
                        filter = 'blur(3px)';
                    }

                    wrapper.style.transform = transform;
                    wrapper.style.opacity = opacity;
                    wrapper.style.filter = filter;
                    wrapper.style.zIndex = offset === 0 ? 5 : 1;
                    wrapper.style.pointerEvents = offset === 0 ? 'auto' : 'none';
                });

                const dots = navDots.querySelectorAll('.dot');
                dots.forEach((dot, idx) => {
                    dot.classList.toggle('active', idx === currentIndex);
                });
            }

            function goToSlide(index) {
                if (index === currentIndex || index < 0 || index >= cardsData.length) return;
                currentIndex = index;
                updateCarousel();
                launchMiniConfetti();
            }

            function nextSlide() {
                goToSlide((currentIndex + 1) % cardsData.length);
            }
            function prevSlide() {
                goToSlide((currentIndex - 1 + cardsData.length) % cardsData.length);
            }

            document.getElementById('nextBtn').addEventListener('click', nextSlide);
            document.getElementById('prevBtn').addEventListener('click', prevSlide);

            let touchStartX = 0;
            carousel.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            });
            carousel.addEventListener('touchend', (e) => {
                const diff = e.changedTouches[0].screenX - touchStartX;
                if (Math.abs(diff) > 50) {
                    diff > 0 ? prevSlide() : nextSlide();
                }
            });

            carousel.addEventListener('click', (e) => {
                const wrapper = e.target.closest('.card-wrapper');
                if (!wrapper) return;
                const clickedIndex = parseInt(wrapper.dataset.index, 10);
                if (clickedIndex !== currentIndex) {
                    goToSlide(clickedIndex);
                }
            });

            // Свечи
            const candlesRow = document.getElementById('candlesRow');
            const totalCandles = 8;
            for (let i = 0; i < totalCandles; i++) {
                const candle = document.createElement('div');
                candle.className = 'candle';
                candle.innerHTML = '<span class="flame">🔥</span><span class="wick">🕯️</span><span class="smoke">💨</span>';
                candle.addEventListener('click', function() {
                    if (this.classList.contains('extinguished')) return;
                    this.classList.add('extinguished');
                    spawnMiniBurst(this);
                    checkAllCandles();
                });
                candlesRow.appendChild(candle);
            }

            function checkAllCandles() {
                const allExtinguished = [...candlesRow.querySelectorAll('.candle')].every(c => c.classList.contains('extinguished'));
                if (allExtinguished) {
                    setTimeout(() => {
                        launchFullScreenFirework();
                        setTimeout(() => {
                            candlesRow.querySelectorAll('.candle').forEach(c => c.classList.remove('extinguished'));
                        }, 3500);
                    }, 400);
                }
            }

            function spawnMiniBurst(element) {
                const rect = element.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                for (let i = 0; i < 15; i++) {
                    createParticle(cx, cy, '#ff9800', 3);
                }
            }

            // Лепестки
            function createPetal() {
                const petal = document.createElement('div');
                petal.className = 'petal';
                const colors = ['#f8bbd0','#f48fb1','#fce4ec','#ffcdd2','#fff9c4','#ffccbc','#e1bee7','#ffebee'];
                petal.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                petal.style.left = Math.random() * 100 + '%';
                petal.style.width = (Math.random() * 20 + 10) + 'px';
                petal.style.height = (Math.random() * 20 + 10) + 'px';
                petal.style.borderRadius = Math.random() > 0.5 ? '50% 0 50% 0' : '0 50% 0 50%';
                petal.style.animationDuration = (Math.random() * 6 + 6) + 's';
                petal.style.animationDelay = Math.random() * 4 + 's';
                document.body.appendChild(petal);
                setTimeout(() => petal.remove(), 12000);
            }
            for (let i = 0; i < 35; i++) setTimeout(createPetal, i * 300);
            setInterval(createPetal, 2500);

            // Canvas фейерверк
            const canvas = document.getElementById('fireworkCanvas');
            const ctx = canvas.getContext('2d');
            let particles = [];
            let animationId;

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            class Particle {
                constructor(x, y, color, size, vx, vy, life = 1) {
                    this.x = x; this.y = y; this.color = color; this.size = size;
                    this.vx = vx; this.vy = vy; this.life = life; this.maxLife = life;
                    this.gravity = 0.04; this.friction = 0.98;
                }
                update() {
                    this.vx *= this.friction; this.vy *= this.friction;
                    this.vy += this.gravity;
                    this.x += this.vx; this.y += this.vy;
                    this.life -= 0.008;
                }
                draw(ctx) {
                    ctx.save();
                    ctx.globalAlpha = this.life;
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
                get alive() { return this.life > 0; }
            }

            function createParticle(x, y, color, count = 40) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 6 + 2;
                    const size = Math.random() * 3 + 1.5;
                    const vx = Math.cos(angle) * speed;
                    const vy = Math.sin(angle) * speed - Math.random() * 3;
                    particles.push(new Particle(x, y, color, size, vx, vy, Math.random() * 0.6 + 0.6));
                }
            }

            // Новый салют на весь экран
            function launchFullScreenFirework() {
                const colors = ['#e91e63','#ff6f00','#ffd54f','#4caf50','#2196f3','#9c27b0','#ff4081','#00e5ff','#ffab40','#ea80fc'];
                const cols = 4;
                const rows = 3;
                const cellWidth = canvas.width / cols;
                const cellHeight = canvas.height / rows;

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const x = cellWidth * (c + Math.random());
                        const y = cellHeight * (r + Math.random());
                        const color = colors[Math.floor(Math.random() * colors.length)];
                        setTimeout(() => {
                            createParticle(x, y, color, 80 + Math.floor(Math.random() * 40));
                        }, Math.random() * 500);
                    }
                }

                // Дополнительная серия взрывов через небольшую паузу для заполнения
                setTimeout(() => {
                    for (let i = 0; i < 6; i++) {
                        const x = Math.random() * canvas.width;
                        const y = Math.random() * canvas.height;
                        const color = colors[Math.floor(Math.random() * colors.length)];
                        createParticle(x, y, color, 70);
                    }
                }, 600);
            }

            function launchMiniConfetti() {
                const cx = canvas.width / 2;
                const cy = canvas.height * 0.5;
                createParticle(cx, cy, '#ffd54f', 20);
                createParticle(cx - 100, cy - 50, '#e91e63', 15);
                createParticle(cx + 100, cy - 50, '#4caf50', 15);
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles = particles.filter(p => p.alive);
                particles.forEach(p => { p.update(); p.draw(ctx); });
                animationId = requestAnimationFrame(animate);
            }
            animate();

            document.getElementById('fireworkBtn').addEventListener('click', () => {
                launchFullScreenFirework();
                if (navigator.vibrate) navigator.vibrate([50, 30, 50, 30, 100]);
            });

            // Инициализация
            createAllCards();
            updateCarousel();
            setTimeout(() => launchMiniConfetti(), 800);

            // Клавиатура
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight') nextSlide();
                if (e.key === 'ArrowLeft') prevSlide();
                if (e.key === ' ' || e.code === 'Space') {
                    e.preventDefault();
                    launchFullScreenFirework();
                }
            });

            console.log('💖 С днём рождения, мама! Салют на весь экран готов!');
        })();
    </script>
</body>
</html>
